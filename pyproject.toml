[project]
name = "finagent"
version = "0.1.0"
description = "Manual Adjustments Agent: deterministic JE validation with bounded LLM review, human gates and lineage"
readme = "README.md"
authors = [
    { name = "Mighty2Skiddie", email = "ps939919@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "langchain>=1.4.3",
    "langchain-core>=1.6.6",
    "langgraph>=1.2.12",
    "orjson>=3.12.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
llm-google = [
    "langchain-google-genai>=4.4.0",
]
llm-groq = [
    "langchain-groq>=1.1.3",
]
llm-anthropic = [
    "langchain-anthropic>=1.7.5",
]
llm-openai = [
    "langchain-openai>=1.6.7",
]
observability = [
    "langfuse>=4.16.0",
]

[project.scripts]
finagent = "finagent.cli:app"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend", "output"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["src", "tests", "evals"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
strict = ["src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["finagent"]
omit = ["*/api/static.py"]
